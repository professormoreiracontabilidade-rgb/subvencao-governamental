</main><script> 'use strict';
const MODE="aluno";
const slides=["figurinha_01.png","figurinha_02.png","figurinha_03.png","figurinha_04.png","figurinha_05.png","figurinha_06.png","figurinha_07.png","figurinha_08.png","figurinha_09.png","figurinha_10.png","figurinha_11.png","figurinha_12.png","figurinha_13.png","figurinha_14.png","figurinha_15.png","figurinha_16.png","figurinha_17.png","figurinha_18.png","figurinha_19.png","figurinha_20.png"];
const titles=["SUBVENÇÃO GOVERNAMENTAL","O QUE É SUBVENÇÃO?","CONTRIBUIÇÃO PECUNIÁRIA","NÃO É SÓ DINHEIRO!","EXISTEM CONDIÇÕES","ATIVIDADE OPERACIONAL","NÃO É SUBVENÇÃO (1)","NÃO É SUBVENÇÃO (2)","QUANDO RECONHECER?","REQUISITO NÚMERO 1","REQUISITO NÚMERO 2","SEM SEGURANÇA RAZOÁVEL","ATIVO NÃO MONETÁRIO","REGRA DO VALOR JUSTO","VALOR NOMINAL: EXCEÇÃO","EXEMPLO DO TERRENO","SUBVENÇÃO LIGADA A ATIVOS","FORMA 1: RECEITA DIFERIDA","FORMA 2: DEDUÇÃO DO ATIVO","RECEITA AO LONGO DO TEMPO"];
const questions=[{"origem":"FGV - Ana Leg (ALEGO)/ALEGO/Contador/2026","enunciado":"Em 30/12/2025, uma entidade recebeu um terreno por meio de subvenção governamental. Na data, não havia segurança razoável de que a entidade cumpriria todas as condições estabelecidas e relacionadas a esta subvenção.\n\nAssinale a opção que indica o tratamento contábil da subvenção aplicado na elaboração do Balanço Patrimonial da entidade","opcoes":["receita, no resultado.","receita antecipada, no passivo circulante.","receita antecipada, no passivo não circulante.","reserva de capital, no patrimônio líquido.","não deve haver reconhecimento."],"gabarito":"E","comentario":"Sem razoável segurança de cumprimento das condições, o reconhecimento da subvenção não deve ocorrer. A alternativa E é a indicada no gabarito do material."},{"origem":"FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2026","enunciado":"Em 2025, uma sociedade empresária recebeu uma subvenção governamental em troca de cumprimento futuro de algumas condições especificadas.\n\nEstas devem ser relacionadas às atividades","opcoes":["contábeis.","financeiras.","econômicas.","operacionais.","administrativas."],"gabarito":"D","comentario":"O conceito de subvenção governamental relaciona as condições, passadas ou futuras, às atividades operacionais da entidade."},{"origem":"FGV - Aud (CAGE RS)/SEFAZ RS/2025","enunciado":"Em 01/01/2024, uma sociedade empresária adquiriu do Governo uma edificação para a construção de uma fábrica. O valor justo da edificação era de R$ 800.000, no entanto, a sociedade empresária recebeu uma subvenção de 60% do valor, de modo que a compra foi realizada por R$ 320.000, com a condição de geração de empregos para a sociedade. A vida útil estimada da edificação era de 50 anos e a sociedade empresária deprecia os seus ativos imobilizados de acordo com o método da linha reta. Em relação aos fatos, avalie as afirmações a seguir.\n\nI. É prevista uma diminuição anual de R$ 9.600 no passivo.\n\nII. O ativo imobilizado é inicialmente reconhecido contabilmente por R$ 320.000.\n\nIII. No momento da compra é reconhecida uma receita de R$ 480.000.\n\nEstá correto apenas o que se afirma em","opcoes":["I.","II.","III.","I e II.","II e III."],"gabarito":"A","comentario":"Valor da subvenção: 60% × R$ 800.000 = R$ 480.000. Reconhecida como receita diferida, a apropriação anual é R$ 480.000 ÷ 50 = R$ 9.600. Assim, apenas a afirmativa I está correta."},{"origem":"FGV - API (CGM Cuiabá)/Pref Cuiabá/2025","enunciado":"Uma entidade havia recebido uma subvenção governamental.\n\nEm 01/01/2023, o crédito diferido não amortizado relacionado à subvenção era de R$ 20.000. Em decorrência de questões legais, a entidade precisou devolver R$ 50.000 referente à subvenção governamental.\n\nAssinale a opção que indica o reconhecimento realizado na Demonstração do Resultado do Exercício da entidade, decorrente da devolução:","opcoes":["dedução da receita de R$ 50.000.","despesa de R$ 30.000.","despesa de R$ 50.000.","reversão da receita de R$ 30.000.","reversão da receita de R$ 50.000."],"gabarito":"B","comentario":"Da devolução de R$ 50.000, R$ 20.000 compensam o crédito diferido não amortizado. A parcela excedente de R$ 30.000 é reconhecida como despesa."},{"origem":"FGV - ADP (DPE RO)/DPE RO/Contábil/2025","enunciado":"De acordo com o Pronunciamento Técnico CPC 07 (R1)- Subvenção e Assistência Governamentais, até que os requisitos para reconhecimento de uma subvenção governamental como receita na demonstração do resultado sejam atendidos, a contrapartida da subvenção governamental registrada no ativo deve ser feita em conta específica","opcoes":["de ajuste.","de ganhos.","de despesa.","do passivo.","do patrimônio líquido."],"gabarito":"D","comentario":"Enquanto a subvenção registrada no ativo não satisfizer os requisitos para ser reconhecida como receita, sua contrapartida fica em conta específica do passivo."},{"origem":"FGV - Ana Gest (AgSUS)/AgSUS/Contabilidade/2025","enunciado":"De acordo com o Pronunciamento Técnico CPC 07 (R1)- Subvenção e Assistência Governamentais, uma subvenção governamental deve ser reconhecida como receita ao longo do período e confrontada com as despesas que pretende compensar.\n\nEnquanto não atendidos os requisitos para reconhecimento da receita com a subvenção na Demonstração do Resultado, a contrapartida da subvenção governamental registrada no ativo deve ser feita","opcoes":["no passivo.","em despesas.","no patrimônio líquido.","em conta redutora do ativo.","não deve haver reconhecimento."],"gabarito":"A","comentario":"A contrapartida da subvenção já registrada no ativo permanece no passivo até que os requisitos para reconhecer a receita sejam atendidos."},{"origem":"FGV - Ana Leg (ALEAM)/ALEAM/Contador/2025","enunciado":"Um empreendimento recebe incentivo tributário de impostos sobre a renda na forma de redução do tributo devido. De acordo com o Pronunciamento Técnico CPC 07 (R1)- Subvenção e Assistência Governamentais, o reconhecimento deste incentivo é realizado","opcoes":["no Resultado, registrando-se o imposto total, em contrapartida à receita de subvenção equivalente.","no Balanço Patrimonial, registrando-se o ativo com o crédito fiscal, em contrapartida ao passivo equivalente.","no Resultado e no Balanço Patrimonial, registrando-se a receita de subvenção, em contrapartida ao ativo equivalente.","no Resultado e no Balanço Patrimonial, registrando-se o imposto total, em contrapartida ao passivo equivalente.","não há reconhecimento no resultado e no balanço patrimonial."],"gabarito":"A","comentario":"Conforme o gabarito do PDF, a alternativa A registra o imposto total no resultado, com contrapartida na receita de subvenção equivalente."},{"origem":"FGV - ATM (Pref SJC)/Pref SJC/Gestão Tributária/2024","enunciado":"Uma subvenção governamental não deve ser reconhecida até que exista razoável segurança de que","opcoes":["a entidade irá efetuar ampla divulgação a seus acionistas.","o direito à subvenção será publicado no Diário Oficial da União.","os tributos devidos e relacionados à operação serão recolhidos no período.","a entidade irá concluir e publicar as suas Demonstrações Contábeis do período da subvenção.","a entidade cumprirá todas as condições estabelecidas e relacionadas à subvenção e a subvenção será recebida."],"gabarito":"E","comentario":"Dois requisitos cumulativos: razoável segurança de que a entidade cumprirá as condições e de que a subvenção será recebida."},{"origem":"FGV - ANL (CM Fortal)/CM Fortaleza/Contador/2024","enunciado":"De acordo com o Pronunciamento Técnico CPC 07 (R1) – Subvenção e Assistência Governamentais, uma subvenção governamental deve ser reconhecida quando existe razoável segurança de que a subvenção será recebida e","opcoes":["a redução no passivo será relevante para a entidade.","o ativo recebido trará benefícios econômicos futuros.","a alta gestão está comprometida com o aproveitamento da subvenção.","a entidade cumprirá todas as condições estabelecidas e relacionadas à subvenção.","a entidade reconhecerá resultado positivo em suas demonstrações."],"gabarito":"D","comentario":"Além da segurança de recebimento, deve haver razoável segurança de cumprimento de todas as condições relacionadas à subvenção."},{"origem":"FGV - AJ (TJ RR)/TJ RR/Contabilidade/2024","enunciado":"Uma entidade reconheceu a subvenção governamental de um terreno para a construção de uma fábrica como receita, ao longo de um período determinado.\n\nEsse tratamento contábil está","opcoes":["correto, uma vez que é diretamente relacionada à atividade operacional da entidade.","correto, uma vez que foi recebida de uma fonte que não os acionistas e deriva de ato de gestão em benefício da entidade.","incorreto, uma vez não pode ser mensurada com confiabilidade.","incorreto, uma vez que geralmente é gratuita e não pode ser confrontada com custos e despesas.","incorreto, uma vez que os tributos não são reconhecidos como despesas e a subvenção governamental é, em essência, uma extensão da política fiscal."],"gabarito":"B","comentario":"O reconhecimento sistemático da subvenção como receita ao longo do período é admitido. O gabarito do documento aponta a alternativa B."},{"origem":"FGV - Ana TI (DATAPREV)/DATAPREV/Contabilidade/2024","enunciado":"Uma sociedade empresária que trabalha com a produção de carros recebeu do Governo a propriedade definitiva de um terreno, com a condição de construir uma nova fábrica. O terreno tinha valor nominal de R$100.000 e valor justo de R$120.000. Assinale a opção que indica o impacto do recebimento da subvenção governamental nas demonstrações contábeis da sociedade empresária no momento da transferência da propriedade do terreno.","opcoes":["Ativo: R$120.000; Receita: R$120.000","Ativo: R$100.000; Receita: R$100.000","Ativo: R$120.000; Passivo: R$120.000","Ativo: R$100.000; Passivo: R$100.000","Ativo: R$100.000; Ajustes de Avaliação Patrimonial: R$100.000"],"gabarito":"C","comentario":"Como o terreno é um ativo não monetário, o registro é pelo valor justo de R$ 120.000, tanto no ativo quanto na contrapartida do passivo (receita diferida)."}];
const TOTAL=slides.length+questions.length;
const isProfessor=MODE==='professor';
const $=id=>document.getElementById(id);
const stage=$('stage'),image=$('slideImage'),ink=$('ink'),qSheet=$('questionSheet');
const keyPos='PM_CPC07_20_11_2026_'+MODE+'_pos';
const keyInk='PM_CPC07_20_11_2026_professor_ink';
const keyAnswers='PM_CPC07_20_11_2026_'+MODE+'_answers';
let current=0,tool='navigate',color='#d72436',thickness=6,activeStroke=null,lastPoint=null;
let strokes=Array.from({length:TOTAL},()=>[]);
let answers=Array.from({length:questions.length},()=>null),reveals=Array.from({length:questions.length},()=>false);
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safePut(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function status(s){$('liveStatus').textContent=s}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(){let done=0,hit=0;answers.forEach((ans,i)=>{if(ans!==null){done++;if(String.fromCharCode(65+ans)===questions[i].gabarito)hit++}});return {done,hit}}
function refreshScore(){let {done,hit}=score();$('score').textContent=isProfessor?'11 questões FGV · gabarito sob demanda':`Questões respondidas: ${done}/11 · Acertos: ${hit} · Erros: ${done-hit}`}
function paintDots(){Array.from($('pips').children).forEach((e,i)=>{e.classList.toggle('active',i===current);e.setAttribute('aria-current',i===current?'step':'false')})}
function renderQuestion(){
 const qi=current-slides.length,q=questions[qi],selected=answers[qi];
 const reveal=isProfessor?reveals[qi]:selected!==null;
 const correct=q.gabarito.charCodeAt(0)-65;
 let a=`<div class="q-eyebrow">Questão ${qi+1} de ${questions.length} • Banca FGV</div><div class="q-source">${escapeHtml(q.origem)}</div><h2 class="q-title">Subvenção governamental</h2><p class="q-stem">${escapeHtml(q.enunciado)}</p><div class="options" role="group" aria-label="Alternativas da questão ${qi+1}">`;
 q.opcoes.forEach((o,i)=>{
  const cls=reveal?(i===correct?' correct':selected===i?' wrong':''):'';
  const lock=(!isProfessor&&selected!==null)?' data-locked="true"':'';
  a+=`<button type="button" class="q-option${cls}" data-answer="${i}"${lock}><span class="q-letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(o)}</span></button>`;
 });
 a+='</div>';
 if(isProfessor){a+=`<button type="button" class="q-reveal" data-reveal="1">${reveal?'Ocultar gabarito e comentário':'Mostrar gabarito e comentário'}</button>`}
 if(reveal){const yes=selected===correct;let cls=isProfessor?'good':yes?'good':'bad';let title=isProfessor?`Gabarito do material: ${q.gabarito}`:yes?'✓ Correto!':`✕ Incorreto. Gabarito: ${q.gabarito}`;a+=`<div class="q-feedback ${cls}" role="status"><strong>${title}</strong>${escapeHtml(q.comentario)}</div>`}
 if(qi===questions.length-1&&!isProfessor){const {done,hit}=score();a+=`<div class="q-feedback" aria-live="polite"><strong>Seu resultado até agora</strong>${hit} acertos, ${done-hit} erros, ${questions.length-done} questões pendentes. ${done===questions.length?'Parabéns por concluir as 11 questões!':'Volte às questões anteriores para responder as pendentes.'}</div>`}
 a+='<p class="q-tip">Questão e alternativas reproduzidas do PDF enviado. Gabarito conforme o material.</p>';
 qSheet.innerHTML=a;
 qSheet.setAttribute('aria-label',`Questão ${qi+1} de 11`);
}
function show(index){
 let n=Number(index);if(!Number.isFinite(n))n=0;n=clamp(Math.floor(n),0,TOTAL-1);
 if(activeStroke)finishStroke();
 current=n;const isQuestion=current>=slides.length;
 stage.classList.toggle('question-mode',isQuestion);
 image.hidden=isQuestion;qSheet.hidden=!isQuestion;
 if(isQuestion){renderQuestion();qSheet.scrollTop=0;$('chapter').textContent=`QUESTÕES FGV • ${current-slides.length+1} DE 11`}
 else{image.src=slides[current];image.alt='Figurinha '+(current+1)+' de 20: '+titles[current];$('chapter').textContent=`TEORIA • FIGURINHA ${current+1} DE 20`}
 $('count').textContent=String(current+1).padStart(2,'0')+' / '+TOTAL;
 $('bar').style.width=((current+1)*100/TOTAL)+'%';
 $('progress').setAttribute('aria-valuenow',String(current+1));
 $('prev').disabled=current===0;$('next').disabled=current===TOTAL-1;
 $('next').textContent=current===TOTAL-1?'✓ Fim do material':'Próxima ›';
 paintDots();safePut(keyPos,String(current));refreshScore();if(isProfessor)paintInk();
}
for(let i=0;i<TOTAL;i++){
 const d=document.createElement('button');d.type='button';d.className='dot'+(i>=slides.length?' question-dot':'');
 d.setAttribute('aria-label',i<slides.length?'Ir para a figurinha '+(i+1):'Ir para a questão '+(i-slides.length+1));
 d.title=i<slides.length?titles[i]:questions[i-slides.length].origem;
 d.addEventListener('click',()=>show(i));$('pips').appendChild(d);
}
$('prev').addEventListener('click',()=>show(current-1));
$('next').addEventListener('click',()=>show(current+1));
$('restart').addEventListener('click',()=>{show(0);status('Você voltou para a primeira figurinha. As respostas e anotações continuam guardadas.')});
$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}else if(document.exitFullscreen)await document.exitFullscreen()}catch(e){status('Tela cheia indisponível neste navegador.')}});
$('saveImage').addEventListener('click',()=>{
 if(current>=slides.length){status('Para guardar esta questão, use a função Imprimir do navegador ou uma captura de tela.');return}
 const a=document.createElement('a');a.href=slides[current];a.download='Moreira_CPC07_Figurinha_'+String(current+1).padStart(2,'0')+'.png';document.body.appendChild(a);a.click();a.remove();
});
$('clearAnswers').addEventListener('click',()=>{if(!confirm('Apagar as respostas das 11 questões e recomeçar? As figurinhas serão mantidas.'))return;answers=Array.from({length:questions.length},()=>null);reveals.fill(false);safePut(keyAnswers,JSON.stringify(answers));show(slides.length);status('Respostas reiniciadas.')});
qSheet.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 const qi=current-slides.length;if(qi<0||qi>=questions.length)return;
 if(btn.hasAttribute('data-reveal')){reveals[qi]=!reveals[qi];const p=qSheet.scrollTop;renderQuestion();qSheet.scrollTop=p;return}
 if(!btn.hasAttribute('data-answer'))return;
 if(isProfessor){status('Para projetar a correção, clique em “Mostrar gabarito e comentário”.');return}
 if(answers[qi]!==null)return;
 const a=Number(btn.dataset.answer);answers[qi]=a;safePut(keyAnswers,JSON.stringify(answers));
 const p=qSheet.scrollTop;renderQuestion();qSheet.scrollTop=p;refreshScore();
 const hit=String.fromCharCode(65+a)===questions[qi].gabarito;
 status(hit?'Alternativa correta!':'Alternativa incorreta. Veja o gabarito e o comentário.');beep(hit);
});
let audioContext=null;
function beep(good){try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.type=good?'sine':'triangle';o.frequency.setValueAtTime(good?620:250,audioContext.currentTime);if(good)o.frequency.exponentialRampToValueAtTime(860,audioContext.currentTime+.14);else o.frequency.exponentialRampToValueAtTime(175,audioContext.currentTime+.18);g.gain.setValueAtTime(.08,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.22);o.start();o.stop(audioContext.currentTime+.23)}catch(e){}}
document.addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if(e.target.closest&&e.target.closest('#questionSheet'))return; // preserva navegação/scroll com teclado dentro da questão
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(current+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(current-1)}
 else if(e.key==='Home'){e.preventDefault();show(0)}
 else if(e.key==='End'){e.preventDefault();show(TOTAL-1)}
});
// Reconhecimento do gesto na área da figurinha ou na margem do card das questões.
let swipe=null,touchStart=null;
stage.addEventListener('pointerdown',e=>{
 if(tool!=='navigate'||(e.button!==0&&e.pointerType==='mouse'))return;
 if(e.target.closest('#questionSheet') && e.target.closest('button'))return;
 swipe={id:e.pointerId,x:e.clientX,y:e.clientY};
 // Não capturar o ponteiro nos cartões: deixa o usuário rolar questões grandes.
 if(!e.target.closest('#questionSheet'))try{stage.setPointerCapture(e.pointerId)}catch(_){ }
});
stage.addEventListener('pointerup',e=>{
 if(!swipe||tool!=='navigate'||e.pointerId!==swipe.id)return;
 const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;
 if(Math.abs(dx)>54&&Math.abs(dx)>Math.abs(dy)*1.25)show(current+(dx<0?1:-1));
});
stage.addEventListener('pointercancel',()=>swipe=null);
if(!window.PointerEvent){stage.addEventListener('touchstart',e=>{if(tool==='navigate'&&e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>54&&Math.abs(dx)>Math.abs(dy)*1.25)show(current+(dx<0?1:-1))},{passive:true})}
function normPoint(e){let r=ink.getBoundingClientRect();return [clamp((e.clientX-r.left)/r.width,0,1),clamp((e.clientY-r.top)/r.height,0,1)]}
function drawStroke(ctx,s,w,h){
 if(!s||!s.points||!s.points.length)return;
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';
 ctx.globalAlpha=(s.tool==='yellow'||s.tool==='green')?.35:1;
 ctx.strokeStyle=s.tool==='yellow'?'#ffe236':s.tool==='green'?'#3ef18b':s.color||'#d72436';
 ctx.lineWidth=(s.width||6)*w/850*(s.tool==='eraser'?4:s.tool==='yellow'||s.tool==='green'?3:1);
 ctx.beginPath();let first=s.points[0];ctx.moveTo(first[0]*w,first[1]*h);
 if(s.points.length===1)ctx.lineTo(first[0]*w+.05,first[1]*h+.05);
 else for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i][0]*w,s.points[i][1]*h);
 ctx.stroke();ctx.restore();
}
function paintInk(){if(!isProfessor)return;let r=ink.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=Math.min(devicePixelRatio||1,2);let w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(ink.width!==w||ink.height!==h){ink.width=w;ink.height=h}let ctx=ink.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);(strokes[current]||[]).forEach(s=>drawStroke(ctx,s,r.width,r.height));if(activeStroke)drawStroke(ctx,activeStroke,r.width,r.height)}
function persistInk(){if(!isProfessor)return;if(!safePut(keyInk,JSON.stringify(strokes)))status('Anotações mantidas nesta sessão. O armazenamento local não está disponível.')}
function finishStroke(){if(!activeStroke)return;strokes[current].push(activeStroke);activeStroke=null;persistInk();paintInk()}
if(isProfessor){
 try{let old=JSON.parse(safeGet(keyInk)||'null');if(Array.isArray(old)&&old.length===TOTAL)strokes=old.map(a=>Array.isArray(a)?a:[])}catch(e){}
 function setTool(t){if(activeStroke)finishStroke();tool=t;stage.classList.toggle('writing',t!=='navigate');stage.classList.toggle('pen',t==='pen');stage.classList.toggle('eraser',t==='eraser');stage.classList.toggle('highlight',t==='yellow'||t==='green');stage.style.touchAction=t==='navigate'?'pan-y':'none';document.querySelectorAll('[data-tool]').forEach(b=>{const yes=b.dataset.tool===t;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});status(t==='navigate'?'Navegação ativada: deslize a tela ou utilize Anterior/Próxima.':'Ferramenta ativa: anotações salvas individualmente por tela. Para rolar o texto, selecione Navegar.')}
 document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
 document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});setTool('pen')}));
 $('thickness').addEventListener('input',e=>{thickness=parseInt(e.target.value,10)||6;$('thicknessOut').textContent=thickness+' px'});
 $('undo').addEventListener('click',()=>{if(activeStroke)finishStroke();if(strokes[current].length){strokes[current].pop();persistInk();paintInk();status('Último traço desfeito.')}});
 $('clear').addEventListener('click',()=>{if(!strokes[current].length)return;if(confirm('Apagar todas as anotações desta tela?')){strokes[current]=[];persistInk();paintInk();status('Anotações desta tela apagadas.')}});
 ink.addEventListener('pointerdown',e=>{if(tool==='navigate'||(e.button!==0&&e.pointerType==='mouse'))return;e.preventDefault();activeStroke={tool,color,width:thickness,points:[normPoint(e)]};lastPoint=e.pointerId;try{ink.setPointerCapture(e.pointerId)}catch(_){}paintInk()});
 ink.addEventListener('pointermove',e=>{if(!activeStroke||e.pointerId!==lastPoint)return;e.preventDefault();let pt=normPoint(e),prev=activeStroke.points.at(-1);if(Math.abs(pt[0]-prev[0])+Math.abs(pt[1]-prev[1])>.0003){activeStroke.points.push(pt);paintInk()}});
 ink.addEventListener('pointerup',e=>{if(activeStroke&&lastPoint===e.pointerId){e.preventDefault();finishStroke();lastPoint=null}});
 ink.addEventListener('pointercancel',()=>{finishStroke();lastPoint=null});
 window.addEventListener('resize',paintInk);if('ResizeObserver'in window)new ResizeObserver(paintInk).observe(stage);
 setTool('navigate');
}
try{let prior=JSON.parse(safeGet(keyAnswers)||'null');if(Array.isArray(prior)&&prior.length===questions.length){answers=prior.map(v=>Number.isInteger(v)&&v>=0&&v<=4?v:null)}}catch(e){}
let first=Number.parseInt(safeGet(keyPos)||'0',10);show(Number.isFinite(first)?first:0);
</script></body></html>
