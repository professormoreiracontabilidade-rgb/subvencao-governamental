<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102941"><meta name="description" content="20 figurinhas de revisão de Subvenção Governamental — Curso de Contabilidade Professor Moreira"><title>Subvenção Governamental — 20 Figurinhas | Professor Moreira</title><style>
:root{color-scheme:dark;--bg:#071a2a;--gold:#ffbb51;--white:#e8f2fa}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1b4261 0%,#071827 78%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white);min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:9px;padding:9px 8px 13px}
header{width:min(98vw,640px);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(13px,2.5vw,19px);font-weight:800}header .small{font-size:12px;opacity:.86;letter-spacing:.08em}header b{color:var(--gold)}
.progress{height:5px;width:min(98vw,640px);background:#3a5166;border-radius:30px;overflow:hidden}.progress span{height:100%;background:var(--gold);display:block;width:5%;transition:width .2s}
.viewport{flex:1;display:flex;align-items:center;justify-content:center;width:min(100vw,640px);position:relative;min-height:0;touch-action:pan-y}
.figure{height:min(calc(100dvh - 150px), calc(98vw * 1.7777778));max-height:calc(100dvh - 150px);max-width:calc(100vw - 14px);width:auto;aspect-ratio:9/16;object-fit:contain;box-shadow:0 17px 50px rgba(0,0,0,.4);border-radius:14px;user-select:none;-webkit-user-drag:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:7px;width:min(98vw,640px);padding:4px 0}button{background:#21405a;color:#fff;border:1px solid #577189;border-radius:12px;min-height:42px;font-size:15px;padding:7px 12px;cursor:pointer;font-weight:700}button:hover{background:#315a7b}button:disabled{opacity:.32;cursor:not-allowed}.nav .mainbutton{background:var(--gold);color:#112a41;border:0;font-size:18px;padding:10px 20px}
.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(98vw,640px)}.tools button{font-size:12px;min-height:32px;padding:5px 11px}
.pips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;width:min(100%,640px)}.pip{height:5px;width:13px;background:#526a7e;border-radius:9px}.pip.active{background:var(--gold);width:27px}
.note{color:#bdd1df;font-size:12px;text-align:center;margin:0}@media (max-height:640px){.note,.tools{display:none}.figure{height:min(calc(100dvh - 112px), calc(98vw * 1.7778))}}
</style></head><body>
<main class="app"><header><div><div class="small">CURSO DE CONTABILIDADE</div>PROFESSOR MOREIRA</div><b id="count">01 / 20</b></header><div class="progress" role="progressbar" aria-label="Progresso" id="progress" aria-valuemin="1" aria-valuemax="20"><span id="bar"></span></div><section class="viewport" id="viewport" aria-label="Carrossel de figurinhas"><img class="figure" id="figure" src="figurinha_01.png" draggable="false" alt="Figurinha 1 de 20: Subvenção Governamental" /></section><div class="nav"><button id="back" aria-label="Figurinha anterior">‹ Anterior</button><button class="mainbutton" id="forward" aria-label="Próxima figurinha">Próxima ›</button></div><div class="pips" id="pips" aria-label="20 figurinhas"></div><div class="tools"><button id="restart">↺ Reiniciar</button><button id="fullscreen">⛶ Tela cheia</button><button id="download">↓ Salvar figurinha</button></div><p class="note">Arraste a imagem com o dedo ou use as setas do teclado. O progresso fica salvo neste aparelho.</p></main>
<script>const const slides=["figurinha_01.png", "figurinha_02.png", "figurinha_03.png", "figurinha_04.png", "figurinha_05.png", "figurinha_06.png", "figurinha_07.png", "figurinha_08.png", "figurinha_09.png", "figurinha_10.png", "figurinha_11.png", "figurinha_12.png", "figurinha_13.png", "figurinha_14.png", "figurinha_15.png", "figurinha_16.png", "figurinha_17.png", "figurinha_18.png", "figurinha_19.png", "figurinha_20.png"];;const labels=["SUBVENÇÃO GOVERNAMENTAL", "O QUE É SUBVENÇÃO?", "CONTRIBUIÇÃO PECUNIÁRIA", "NÃO É SÓ DINHEIRO!", "EXISTEM CONDIÇÕES", "ATIVIDADE OPERACIONAL", "NÃO É SUBVENÇÃO (1)", "NÃO É SUBVENÇÃO (2)", "QUANDO RECONHECER?", "REQUISITO NÚMERO 1", "REQUISITO NÚMERO 2", "SEM SEGURANÇA RAZOÁVEL", "ATIVO NÃO MONETÁRIO", "REGRA DO VALOR JUSTO", "VALOR NOMINAL: EXCEÇÃO", "EXEMPLO DO TERRENO", "SUBVENÇÃO LIGADA A ATIVOS", "FORMA 1: RECEITA DIFERIDA", "FORMA 2: DEDUÇÃO DO ATIVO", "RECEITA AO LONGO DO TEMPO"];const TOTAL=slides.length;let current=0;const $=id=>document.getElementById(id);const image=$('figure'),pips=$('pips');
for(let k=0;k<TOTAL;k++){let p=document.createElement('span');p.className='pip';pips.appendChild(p)}
function show(k){current=Math.max(0,Math.min(TOTAL-1,k));image.src=slides[current];image.alt=`Figurinha ${current+1} de ${TOTAL}: ${labels[current]}`;$('count').textContent=`${String(current+1).padStart(2,'0')} / ${TOTAL}`;$('bar').style.width=(current+1)*100/TOTAL+'%';$('progress').setAttribute('aria-valuenow',String(current+1));$('back').disabled=current===0;$('forward').textContent=current===TOTAL-1?'✓ Concluído':'Próxima ›';document.querySelectorAll('.pip').forEach((p,i)=>p.classList.toggle('active',i===current));try{localStorage.setItem('moreira_subvencao_20_figurinhas',String(current))}catch(e){}}
$('back').addEventListener('click',()=>show(current-1));$('forward').addEventListener('click',()=>show(current+1));$('restart').addEventListener('click',()=>show(0));$('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else{document.exitFullscreen?.()}});
$('download').addEventListener('click',()=>{const a=document.createElement('a');a.href=slides[current];a.download=`Professor_Moreira_Subvencao_${String(current+1).padStart(2,'0')}.png`;document.body.appendChild(a);a.click();a.remove()});
let x0=null,y0=null;const vp=$('viewport');vp.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY}},{passive:true});vp.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25)show(current+(dx<0?1:-1));x0=y0=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){show(current+1)}else if(e.key==='ArrowLeft'){show(current-1)}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(TOTAL-1)}});
let saved=0;try{saved=parseInt(localStorage.getItem('moreira_subvencao_20_figurinhas')||'0',10)}catch(e){}show(Number.isFinite(saved)?saved:0);
</script></body></html>
